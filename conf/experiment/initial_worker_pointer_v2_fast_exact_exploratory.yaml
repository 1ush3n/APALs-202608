defaults:
  - /model/hb_gat_pn@_global_
  - /env/apal_default@_global_
  - /env/initial_schedule@_global_
  - /env/initial_bucket_680@_global_
  - /reward/default@_global_
  - /train/ppo_default@_global_
  - /train/batch_4@_global_
  - /rollout/fastpath@_global_
  - _self_

experiment:
  experiment_name: initial_worker_pointer_v2_fast_exact_exploratory
  runs_root: results/02_initial_fast_exact
  checkpoint_root: checkpoints
  evaluation_protocol: training_auto_eval_only
  train_data_path_or_dir: data/scale_400_800_datasets
  training_manifest_path: data/scale_400_800_datasets/manifest.json
  data_file_path: data/680.csv
  enable_multiscale_training: false
  multiscale_min_ops: 400
  multiscale_max_ops: 800
  multiscale_sampling_exponent: 0.5
  multiscale_min_updates: 600
  multiscale_max_updates: 3300
  enable_multi_benchmark_eval: false
  multi_benchmark_data_paths: []
  multi_benchmark_reference_makespans: '{}'
  checkpoint_selection_protocol: multiscale_manifest
  checkpoint_selection_manifest_path: data/initial_selection_manifests/real_four_instances_temperature0_v1.json

model:
  team_selection_mode: autoregressive_pressure_v2_fast_exact
  policy_action_scope: operation_station_worker
  actor_context_mode: attention
  worker_pointer_context_version: pressure_v2_normwork_headcount_physicalwait_v1
  worker_pointer_pressure_temperature: 1.0
  worker_pointer_supply_epsilon: 1.0e-6
  worker_pointer_wait_discount_mode: physical_wait_exponential_v1
  worker_pointer_v2_init_seed_offset: 1009

train:
  batch_size: 256
  accumulation_steps: 16
  num_envs: 4
  lightning_precision: bf16-mixed
  eval_freq: 1
  eval_temperature: 0.0
  async_eval_enabled: true
  async_eval_device: cpu
  async_eval_cpu_threads: 4
  async_eval_worker_count: 2
  async_eval_queue_capacity: 4
  async_eval_submit_every_episodes: 3
  async_eval_wait_on_finish: true
  async_eval_failure_policy: fail
  async_eval_max_retries: 1
  async_eval_poll_interval_sec: 1.0
  async_eval_heartbeat_interval_sec: 30.0
  async_eval_stale_timeout_sec: 3600.0
  async_eval_use_cached_observation: true
  worker_pointer_v2_replay_mode: behavior_group_exact_gpu_template_v2
  worker_pointer_v2_logical_batch_cap: 256
  worker_pointer_v2_rollout_group_upper_bound: 16
  worker_pointer_v2_strict_gpu_replay: true
