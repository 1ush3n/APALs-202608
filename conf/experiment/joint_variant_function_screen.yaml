defaults:
  - /model/hb_gat_pn@_global_
  - /env/apal_default@_global_
  - /env/initial_schedule@_global_
  - /env/initial_bucket_680@_global_
  - /reward/default@_global_
  - /train/ppo_default@_global_
  - /train/batch_4@_global_
  - /rollout/fastpath@_global_
  - _self_

experiment:
  experiment_name: joint_variant_function_screen
  # 正式筛查不得绕过 manifest 仅扫描单个历史 CSV。
  train_data_path_or_dir: data/scale_400_800_datasets
  training_manifest_path: data/scale_400_800_datasets/manifest.json
  data_file_path: data/680.csv
  checkpoint_root: checkpoints
  runs_root: runs
  artifact_layout: runs

model:
  hidden_dim: 32
  num_gat_layers: 1
  num_heads: 2
  use_shared_trunk: true

train:
  seed: 42
  num_envs: 2
  max_episodes: 3
  update_every_episodes: 1
  eval_freq: 3
  eval_temperature: 0.0
  eval_scenarios: [standard]
  batch_size: 4
  accumulation_steps: 1
  k_epochs: 1
  use_schedule_free: false
  use_ema: false

rollout:
  rollout_max_steps: 0
  enable_rollout_profiler: true
  enable_rollout_detailed_profiler: true
  rollout_profile_interval: 1
  rollout_profile_cuda_sync: false
  enable_shadow_mask_verification: false
  enable_gpu_batch_rebuild: true
  enable_gpu_tensor_masking: true
