defaults:
  - ../model/hb_gat_pn.yaml
  - ../env/apal_default.yaml
  - ../env/initial_schedule.yaml
  - ../env/initial_bucket_3182.yaml
  - ../reward/default.yaml
  - ../train/ppo_default.yaml
  - ../train/batch_4.yaml
  - ../rollout/fastpath.yaml

experiment:
  experiment_name: multiscale_initial_schedule
  checkpoint_root: checkpoints
  train_data_path_or_dir: data/multiscale_datasets
  data_file_path: data/283.csv
  enable_multiscale_training: true
  multiscale_min_ops: 200
  multiscale_max_ops: 3100
  multiscale_sampling_exponent: 0.5
  multiscale_min_updates: 600
  multiscale_max_updates: 3300
  enable_multi_benchmark_eval: true
  multi_benchmark_data_paths:
    - data/283.csv
    - data/680.csv
    - data/2338.csv
    - data/3182.csv
  multi_benchmark_reference_makespans: '{"283": 158.23, "680": 871.95, "2338": 2648.53, "3182": 3622.06}'
