experiment_name: paper_experiment_suite
output_root: results/paper_experiments
runs_root: runs
run_id: ""

datasets:
  "283": data/283.csv
  "680": data/680.csv
  "2338": data/2338.csv
  "3182": data/3182.csv

train_datasets:
  scale_400_800: data/scale_400_800_datasets
  multiscale: data/multiscale_datasets

result_roots:
  - results
  - runs

reference_makespans:
  "283": 158.23
  "680": 871.95
  "2338": 2648.53
  "3182": 3622.06

methods:
  - full_joint
  - operation_station
  - operation_only
  - operation_station_ea
  - operation_only_ea
  - fixed_preallocation
  - static_topq
  - homogeneous_graphsage
  - operation_station_strict
  - operation_only_strict
  - homogeneous_graphsage_strict
  - no_message_passing
  - mean_max_pooling
  - local_only
  - L2D-PPO-APAL
  - Graph-DDQN-APAL
  - SPT
  - LPT
  - EDD
  - CPM
  - MSL
  - Random
  - Beam
  - IG
  - SA
  - GA

reference_method: full_joint
seeds: [0, 1, 2, 3, 4]
bootstrap_samples: 2000
permutation_samples: 5000
station_count: 5
worker_count: 80

ablations:
  full_joint:
    experiment: scale_400_800_schedule
    overrides: []
  operation_station:
    experiment: scale_400_800_schedule
    overrides:
      - policy_action_scope=operation_station
      - policy_observation_scope=task_station
      - action_completion_mode=earliest_finish
  operation_only:
    experiment: scale_400_800_schedule
    overrides:
      - policy_action_scope=operation
      - policy_observation_scope=task
      - action_completion_mode=earliest_finish
  operation_station_ea:
    experiment: scale_400_800_schedule
    overrides:
      - policy_action_scope=operation_station
      - policy_observation_scope=task_station
      - action_completion_mode=earliest_availability
  operation_only_ea:
    experiment: scale_400_800_schedule
    overrides:
      - policy_action_scope=operation
      - policy_observation_scope=task
      - action_completion_mode=earliest_availability
  fixed_preallocation:
    experiment: scale_400_800_schedule
    overrides:
      - workforce_binding_mode=preallocated
      - workforce_preallocation_ratio=1.0
  static_topq:
    experiment: scale_400_800_schedule
    overrides:
      - team_selection_mode=static_topq
  homogeneous_graphsage:
    experiment: scale_400_800_schedule
    overrides:
      - graph_encoder_mode=homogeneous_graphsage
  no_message_passing:
    experiment: scale_400_800_schedule
    overrides:
      - graph_encoder_mode=none
  mean_max_pooling:
    experiment: scale_400_800_schedule
    overrides:
      - actor_context_mode=mean_max
  local_only:
    experiment: scale_400_800_schedule
    overrides:
      - actor_context_mode=local_only
  operation_station_strict:
    experiment: scale_400_800_schedule
    overrides:
      - policy_action_scope=operation_station
      - policy_observation_scope=task_station
      - graph_input_scope=task_station
      - critic_observation_scope=match_policy
      - action_completion_mode=min_wait
      - station_mask_mode=structural_only
      - ablation_protocol=strict_v1
  operation_only_strict:
    experiment: scale_400_800_schedule
    overrides:
      - policy_action_scope=operation
      - policy_observation_scope=task
      - graph_input_scope=task
      - critic_observation_scope=match_policy
      - task_feature_scope=intrinsic
      - action_completion_mode=min_wait
      - task_mask_mode=precedence_release_only
      - station_mask_mode=structural_only
      - ablation_protocol=strict_v1
  homogeneous_graphsage_strict:
    experiment: scale_400_800_schedule
    overrides:
      - graph_encoder_mode=homogeneous_graphsage_strict
      - homogeneous_use_type_embedding=false
      - homogeneous_shared_input_projection=false
      - policy_observation_scope=full
      - graph_input_scope=full
      - critic_observation_scope=full
      - ablation_protocol=strict_v1

checkpoints:
  full_joint:
    "680": checkpoints/initial_schedule/best_680.ckpt
  operation_station: {}
  operation_only: {}
  operation_station_ea: {}
  operation_only_ea: {}
  fixed_preallocation: {}
  static_topq: {}
  homogeneous_graphsage: {}
  no_message_passing: {}
  mean_max_pooling: {}
  local_only: {}
  operation_station_strict: {}
  operation_only_strict: {}
  homogeneous_graphsage_strict: {}

# 非活动项目（不进入 commands plan，也不应被一键训练）：
