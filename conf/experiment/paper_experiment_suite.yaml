experiment_name: paper_experiment_suite
output_root: results/paper_experiments
runs_root: runs
run_id: ""

datasets:
  "283": data/283.csv
  "680": data/680.csv
  "2338": data/2338.csv
  "3182": data/3182.csv

train_datasets:
  scale_400_800: data/scale_400_800_datasets
  multiscale: data/multiscale_datasets

result_roots:
  - results
  - runs

reference_makespans:
  "283": 158.23
  "680": 871.95
  "2338": 2648.53
  "3182": 3622.06

methods:
  - full
  - no_gat
  - no_attention
  - L2D-PPO-APAL
  - Graph-DDQN-APAL
  - SPT
  - LPT
  - EDD
  - CPM
  - MSL
  - Random
  - Beam
  - IG
  - SA
  - GA

reference_method: full
seeds: [0, 1, 2, 3, 4]
bootstrap_samples: 2000
permutation_samples: 5000
station_count: 5
worker_count: 80

ablations:
  full:
    experiment: scale_400_800_schedule
    overrides: []
  no_gat:
    experiment: scale_400_800_schedule
    overrides:
      - ablation_no_gat=true
  no_attention:
    experiment: scale_400_800_schedule
    overrides:
      - use_attention_critic=false

checkpoints:
  full:
    "680": checkpoints/initial_schedule/best_680.ckpt
  no_gat: {}
  no_attention: {}

# 非活动项目（不进入 commands plan，也不应被一键训练）：
# - no_mask：当前解码器没有 mask 时不可运行。
# - no_pointer：等待重新设计能代表无 Pointer 的合理解码器。
# - no_skill_hub：代码路径保留，但当前实验计划暂缓。
