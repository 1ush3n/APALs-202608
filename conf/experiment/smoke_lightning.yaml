  - ../env/apal_default.yaml
  - ../env/initial_schedule.yaml
  - ../env/initial_bucket_283.yaml
  - ../reward/default.yaml
  - ../train/ppo_default.yaml
  - ../train/batch_32.yaml
  - ../rollout/fastpath.yaml

experiment:
  experiment_name: lightning_smoke

env:
  data_file_path: data/283.csv
  train_data_path_or_dir: data/283.csv

train:
