model:
  hidden_dim: 128
  num_gat_layers: 5
  num_heads: 4
  use_leaky_relu: true
  use_layer_norm: false
  use_input_layer_norm: true
  use_gat_layer_norm: false
  use_head_layer_norm: false
  task_feat_dim: 18
  worker_feat_dim: 22
  station_feat_dim: 15
  use_skill_hub: true
  skill_hub_bidirectional: true
  num_skill_types: 10
  skill_feat_dim: 16
  use_shared_trunk: false
  use_attention_critic: true
  use_autoregressive_worker: true
