train:
  num_envs: 4
  lr: 5.0e-5
  actor_lr_multiplier: 0.5
  critic_lr_multiplier: 1.0
  gamma: 0.999
  gae_lambda: 0.9
  k_epochs: 2
  eps_clip: 0.2
  eps_clip_end: 0.10
  clip_v_grad_norm: 0.05
  batch_size: 32
  accumulation_steps: 16
  auto_oom_retry: false
  skip_update_on_oom: true
  oom_min_batch_size: 2
  oom_max_retries: 0
  oom_transactional_updates: true
  c_policy: 1.0
  c_value: 0.5
  conditional_head_value_coef: 1.0
  c_entropy: 0.0002
  c_entropy_end: 0.00005
  entropy_decay_episodes: 300
  max_episodes: 300
  update_every_episodes: 1
  eval_freq: 1
  eval_temperature: 0.0
  sample_temperature: 1.0
  use_schedule_free: true
  sf_warmup_steps: 30
  use_ema: false
  ema_decay: 0.995
  kl_early_stop: 0.02
