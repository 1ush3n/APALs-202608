[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 忽略输出日志目录，防止采集非代码文件导致的编码错误
norecursedirs = tests/outputs .git .pytest_cache venv env

# 禁用警告输出以保持控制台整洁
addopts = -p no:warnings --basetemp=.pytest_tmp_v2/pytest

markers =
    gpu_safe: 低显存 GPU 安全验证，默认使用小图和显存阈值防止 OOM
    vector_safe: 多进程向量化环境生命周期安全验证
