reschedule_task_delay:
  enable_reschedule_mode: true
  enable_dynamic_events: false
  enable_station_breakdown: false
  enable_material_delay: false
  enable_online_duration_perturb: false
  enable_worker_fatigue: false
  task_feat_dim: 24
  randomize_durations: false
  dur_random_range: 0.0
  data_file_path: data/283.csv
  train_data_path_or_dir: data/283.csv
  reschedule_baseline_schedule_path: results/final_schedule.csv
  reschedule_baseline_model_path: checkpoints/initial_schedule/bestmodel/best_model.pth
  reschedule_scenario_path: ""
  reschedule_eval_scenario_path: results/reschedule_eval_scenarios.csv
  reschedule_eval_scenario_seed: 30300
  reschedule_start_time_min_ratio: 0.15
  reschedule_start_time_max_ratio: 0.65
  reschedule_delay_task_prob: 0.15
  reschedule_delay_min: 5.0
  reschedule_delay_max: 50.0
  reschedule_takt_tolerance: 1e-5
  reschedule_stability_start_weight: 0.20
  reschedule_stability_station_weight: 0.10
  reschedule_stability_team_weight: 0.05
  reschedule_takt_violation_weight: 1.0
  reschedule_infeasible_stability_relax: 0.35
  reschedule_warm_start: true
  reschedule_eval_num_scenarios: 4
